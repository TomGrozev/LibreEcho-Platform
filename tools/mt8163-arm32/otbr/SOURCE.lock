  "license": "BSD-3-Clause",
  "build": {
    "architecture": "armv7",
    "abi": "hard-float",
    "cmake_options": {
      "BUILD_TESTING": "OFF",
      "OTBR_BORDER_AGENT": "ON",
      "OTBR_BORDER_ROUTING": "OFF",
      "OTBR_DBUS": "OFF",
      "OTBR_MDNS": "OFF",
      "OTBR_REST": "OFF",
      "OTBR_WEB": "OFF",
      "OT_REFERENCE_DEVICE": "OFF"
